<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Arta Notes by PT Arta Makmur Jaya Sentosa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <style>
        /* 20 Warna Futurisik */
        .note-1 { background: #f1f5f9; color: #1e293b; border: 1px solid #cbd5e1; }
        .note-2 { background: #fef3c7; color: #78350f; border: 1px solid #fcd34d; }
        .note-3 { background: #d1fae5; color: #064e3b; border: 1px solid #6ee7b7; }
        .note-4 { background: #dbeafe; color: #1e3a8a; border: 1px solid #93c5fd; }
        .note-5 { background: #ffe4e6; color: #881337; border: 1px solid #fda4af; }
        .note-6 { background: #ede9fe; color: #5b21b6; border: 1px solid #a78bfa; }
        .note-7 { background: #ffedd5; color: #7c2d12; border: 1px solid #fdba74; }
        .note-8 { background: #ecfccb; color: #3f6212; border: 1px solid #bef264; }
        .note-9 { background: #cffafe; color: #155e75; border: 1px solid #67e8f9; }
        .note-10 { background: #e0f2fe; color: #075985; border: 1px solid #7dd3fc; }
        .note-11 { background: #f5d0fe; color: #701a75; border: 1px solid #e879f9; }
        .note-12 { background: #fce7f3; color: #9d174d; border: 1px solid #f9a8d4; }
        .note-13 { background: #fef3c7; color: #92400e; border: 1px solid #fcd34d; }
        .note-14 { background: #99f6e4; color: #115e59; border: 1px solid #5eead4; }
        .note-15 { background: #e0e7ff; color: #3730a3; border: 1px solid #a5b4fc; }
        .note-16 { background: #f3e8ff; color: #581c87; border: 1px solid #c084fc; }
        .note-17 { background: #e4e4e7; color: #27272a; border: 1px solid #d4d4d8; }
        .note-18 { background: #e7e5e4; color: #292524; border: 1px solid #d6d3d1; }
        .note-19 { background: #e5e5e5; color: #262626; border: 1px solid #d4d4d4; }
        .note-20 { background: #fee2e2; color: #991b1b; border: 1px solid #f87171; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-200 min-h-screen flex flex-col font-sans">

    <!-- NAVBAR -->
    <nav class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 p-4 sticky top-0 z-40">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <img src="https://images.bukaolshop.com/hosting/54490/baeebfa8be78791927.png"" alt="Logo" class="w-10 h-10 rounded-lg">
                <h1 class="font-bold text-xl"></b></b>CATATAN PENTING</h1>
            </div>
            <button id="themeToggle" class="p-2 rounded-full hover:bg-slate-200 dark:hover:bg-slate-700 transition">
                <i class="fa-solid fa-moon text-lg" id="themeIcon"></i>
            </button>
        </div>
    </nav>

    <!-- CONTENT -->
    <main class="flex-grow max-w-5xl mx-auto p-4 py-8 w-full">
        <div class="flex flex-col md:flex-row justify-between mb-8 gap-4">

            <div class="flex gap-2">
                <select id="categoryFilter" onchange="renderNotes()" class="p-2 rounded-lg border bg-white dark:bg-slate-800 dark:border-slate-700 text-sm outline-none w-48">
                    <option value="Semua">Semua Kategori</option>
                </select>
                <button onclick="openNoteModal()" class="bg-yellow-600 text-white px-6 py-2 rounded-lg hover:bg-yellow-700 transition whitespace-nowrap font-bold">
                    <i class="fa-solid fa-plus mr-2"></i> Baru
                </button>
            </div>
        </div>
        <div id="notesGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4"></div>
    </main>

    <!-- FOOTER -->
    <footer class="bg-white dark:bg-slate-800 py-8 text-center border-t border-slate-200 dark:border-slate-700 mt-auto">
        <p class="font-bold text-slate-800 dark:text-white">PT ARTA MAKMUR JAYA SENTOSA</p>
        <p class="text-xs text-slate-500 mt-1">© 2026 Hak Cipta Dilindungi</p>
    </footer>

    <!-- MODAL TAMBAH/EDIT -->
    <div id="noteModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-800 w-full max-w-md p-6 rounded-3xl shadow-2xl">
            <input type="hidden" id="noteId">
            <input type="text" id="noteTitle" placeholder="Judul catatan..." class="w-full mb-3 p-3 border rounded-xl dark:bg-slate-900 dark:border-slate-700 outline-none focus:ring-2 focus:ring-yellow-500">
            <input type="text" id="noteCategory" placeholder="Kategori..." class="w-full mb-3 p-3 border rounded-xl dark:bg-slate-900 dark:border-slate-700 outline-none">
            <textarea id="noteContent" rows="5" placeholder="Isi catatan..." class="w-full mb-3 p-3 border rounded-xl dark:bg-slate-900 dark:border-slate-700 outline-none"></textarea>
            
            <p class="text-xs font-bold mb-2 uppercase opacity-60">Pilih Warna:</p>
            <div id="colorPicker" class="grid grid-cols-5 gap-2 mb-6 h-20 overflow-y-auto p-2 bg-slate-100 dark:bg-slate-900 rounded-lg"></div>
            
            <div class="flex justify-end gap-2">
                <button onclick="closeNoteModal()" class="px-6 py-2 text-slate-500">Batal</button>
                <button onclick="saveNote()" class="px-6 py-2 bg-yellow-600 text-white rounded-xl font-bold shadow-lg shadow-yellow-600/30 hover:bg-yellow-500">Simpan</button>
            </div>
        </div>
    </div>

    <!-- MODAL BACA -->
    <div id="viewModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-800 w-full max-w-lg p-8 rounded-3xl shadow-2xl border dark:border-slate-700">
            <h3 id="viewTitle" class="font-bold text-2xl mb-4 pb-4 border-b dark:border-slate-700"></h3>
            <div id="viewContent" class="text-sm opacity-90 whitespace-pre-wrap leading-relaxed mb-6 overflow-y-auto max-h-[50vh] pr-2"></div>
            <button onclick="document.getElementById('viewModal').classList.add('hidden')" class="w-full py-3 bg-slate-200 dark:bg-slate-700 rounded-xl font-bold hover:opacity-80 transition">Tutup</button>
        </div>
    </div>

    <script>
        let notes = JSON.parse(localStorage.getItem('arta_notes')) || [];

        // Init Theme
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            document.getElementById('themeIcon').className = 'fa-solid fa-sun';
        }

        document.getElementById('themeToggle').addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
            localStorage.theme = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
            document.getElementById('themeIcon').className = document.documentElement.classList.contains('dark') ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
        });

        // Color Picker Init
        const cp = document.getElementById('colorPicker');
        for(let i=1; i<=20; i++) cp.innerHTML += `<label class="w-6 h-6 rounded-full note-${i} cursor-pointer flex items-center justify-center shadow-sm"><input type="radio" name="noteColor" value="${i}" ${i===1?'checked':''}></label>`;

        // Helper
        function formatDateTime(ts) {
            const d = new Date(ts);
            return d.toLocaleDateString('id-ID', {day:'2-digit', month:'short', year:'numeric'}) + ' ' + d.toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'});
        }

        function openNoteModal(id = null) {
            const n = notes.find(note => note.id === id);
            document.getElementById('noteId').value = n ? n.id : '';
            document.getElementById('noteTitle').value = n ? n.title : '';
            document.getElementById('noteCategory').value = n ? n.category : '';
            document.getElementById('noteContent').value = n ? n.content : '';
            if(n) document.querySelector(`input[name="noteColor"][value="${n.color}"]`).checked = true;
            document.getElementById('noteModal').classList.remove('hidden');
        }

        function viewNote(id) {
            const n = notes.find(note => note.id === id);
            document.getElementById('viewTitle').innerText = n.title;
            document.getElementById('viewContent').innerText = n.content;
            document.getElementById('viewModal').classList.remove('hidden');
        }

        function closeNoteModal() { document.getElementById('noteModal').classList.add('hidden'); }

        function saveNote() {
            const id = parseInt(document.getElementById('noteId').value) || Date.now();
            const note = {
                id,
                title: document.getElementById('noteTitle').value,
                category: document.getElementById('noteCategory').value || 'Umum',
                content: document.getElementById('noteContent').value,
                color: document.querySelector('input[name="noteColor"]:checked').value,
                updatedAt: Date.now()
            };
            notes = notes.filter(n => n.id !== id);
            notes.push(note);
            localStorage.setItem('arta_notes', JSON.stringify(notes));
            updateFilter();
            closeNoteModal();
            renderNotes();
        }

        function deleteNote(id) {
            if(confirm("Hapus catatan ini?")) {
                notes = notes.filter(n => n.id !== id);
                localStorage.setItem('arta_notes', JSON.stringify(notes));
                updateFilter();
                renderNotes();
            }
        }

        function updateFilter() {
            const filter = document.getElementById('categoryFilter');
            const currentVal = filter.value;
            const categories = [...new Set(notes.map(n => n.category || 'Umum'))];
            filter.innerHTML = '<option value="Semua">Semua Kategori</option>';
            categories.forEach(c => filter.innerHTML += `<option value="${c}" ${c === currentVal ? 'selected' : ''}>${c}</option>`);
        }

        function renderNotes() {
            const grid = document.getElementById('notesGrid');
            const filter = document.getElementById('categoryFilter').value;
            grid.innerHTML = '';
            
            const filtered = filter === 'Semua' ? notes : notes.filter(n => (n.category || 'Umum') === filter);

            filtered.sort((a,b) => b.updatedAt - a.updatedAt).forEach(note => {
                const card = document.createElement('div');
                card.className = `note-${note.color} p-5 rounded-2xl relative border cursor-pointer hover:shadow-lg transition-all`;
                card.innerHTML = `
                    <div class="flex justify-end gap-2 mb-3">
                        <button onclick="event.stopPropagation(); openNoteModal(${note.id})" class="bg-black/10 px-4 py-2 rounded-lg text-sm hover:bg-black/20"><i class="fa-solid fa-pen"></i></button>
                        <button onclick="event.stopPropagation(); deleteNote(${note.id})" class="bg-red-500/20 px-4 py-2 rounded-lg text-sm hover:bg-red-500 hover:text-white"><i class="fa-solid fa-trash"></i></button>
                    </div>
                    <div class="text-[10px] font-bold uppercase opacity-70 tracking-widest">${note.category || 'Umum'}</div>
                    <h3 class="font-bold text-xl mt-1">${note.title}</h3>
                    <div class="mt-4 text-[10px] opacity-60 italic"><i class="fa-regular fa-clock"></i> ${formatDateTime(note.updatedAt)}</div>
                `;
                card.onclick = () => viewNote(note.id);
                grid.appendChild(card);
            });
        }

        updateFilter();
        renderNotes();
    </script>
</bod
