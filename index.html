<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CATATAN PENTING</title>
    <!-- Menggunakan font modern -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <!-- Menghubungkan ke file CSS terpisah -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <nav>
        <div class="nav-brand-container" onclick="showPage('home')">
            <img src="https://github.com/artafortuna/website1/blob/main/Logo%20Buku%20Emas.png?raw=true" alt="App Logo">
            <div class="nav-brand">CATATAN PENTING</div>
        </div>
        
        <div class="nav-controls">
            <input type="text" id="searchInput" class="search-bar" placeholder="Cari catatan..." onkeyup="searchNotes()">
            <button class="theme-toggle" onclick="toggleTheme()" title="Ganti Tema">
                <!-- Icon Moon -->
                <svg id="moonIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                <!-- Icon Sun -->
                <svg id="sunIcon" style="display:none;" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
            </button>
        </div>
    </nav>

    <main>
        <!-- HALAMAN BERANDA -->
        <div id="pageHome">
            <div class="page-header">
                <h2>Catatan Saya</h2>
                <button class="btn btn-primary glow-effect" onclick="showPage('form')">+ Buat Baru</button>
            </div>
            <section class="notes-grid" id="notesContainer">
                <!-- Catatan akan dirender di sini -->
            </section>
        </div>

        <!-- HALAMAN FORM -->
        <div id="pageForm" style="display: none;">
            <!-- Menggunakan history.back() agar sinkron dengan routing bawaan HP -->
            <button class="btn btn-secondary glow-effect" onclick="history.back()" style="margin-bottom: 0.8rem;">&larr; Kembali</button>
            <aside class="form-section glow-border">
                <h2 id="formTitle" style="margin-bottom: 1rem;">Buat Catatan Baru</h2>
                <form id="noteForm">
                    <input type="hidden" id="noteId">
                    
                    <div class="form-group">
                        <label for="title">Judul Catatan</label>
                        <input type="text" id="title" class="glow-input" required placeholder="Tulis judul di sini...">
                    </div>
                    
                    <div class="form-group">
                        <label for="category">Kategori</label>
                        <input type="text" id="category" class="glow-input" required placeholder="Contoh: Liburan, Tugas...">
                    </div>
                    
                    <div class="form-group">
                        <label for="noteType">Tipe Catatan</label>
                        <select id="noteType" class="glow-input" onchange="toggleNoteTypeInput()">
                            <option value="text">📄 Catatan Biasa</option>
                            <option value="checklist">☑️ Catatan Checklist</option>
                        </select>
                    </div>

                    <div class="form-group" id="textContentFormGroup">
                        <label for="content">Isi Catatan</label>
                        <textarea id="content" class="glow-input" required placeholder="Tulis catatan pentingmu di sini..."></textarea>
                    </div>

                    <div class="form-group" id="checklistFormGroup" style="display: none;">
                        <label>Daftar Checklist / Tugas</label>
                        <div style="display: flex; gap: 0.4rem; margin-bottom: 0.6rem;">
                            <input type="text" id="newChecklistItem" class="glow-input" placeholder="Tambah kegiatan baru..." onkeypress="handleChecklistEnter(event)">
                            <button type="button" class="btn btn-primary glow-effect" onclick="triggerAddChecklist()" style="padding: 0.3rem 0.8rem;">+</button>
                        </div>
                        <div id="checklistItemsContainer" style="display: flex; flex-direction: column; gap: 0.4rem;">
                            <!-- Baris checklist muncul di sini -->
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="image">Lampirkan Foto (Opsional)</label>
                        <input type="file" id="image" class="glow-input file-input" accept="image/*" onchange="previewImage(event)">
                        <input type="hidden" id="existingImage">
                        
                        <div id="imagePreviewBox" class="image-preview-box glow-border" style="display: none;">
                            <img id="imagePreview" src="" alt="Preview">
                            <br>
                            <button type="button" class="btn btn-danger glow-effect" onclick="removeImage()" style="margin-top: 0.4rem;">🗑️ Hapus Gambar</button>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-primary glow-effect submit-btn" id="submitBtn">Simpan Catatan</button>
                </form>
            </aside>
        </div>

        <!-- HALAMAN DETAIL (BACA CATATAN) -->
        <div id="pageDetail" style="display: none;">
            <!-- Tombol Kembali dihapus (menggunakan fitur Back Bawaan HP) -->
            <div class="detail-container glow-border">
                <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.5rem;">
                    <span id="viewCategory" class="note-category"></span>
                    <!-- Tombol Salin (Copy Icon Only) -->
                    <button class="copy-btn" onclick="copyNote()" title="Salin Catatan">
                        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                        </svg>
                    </button>
                </div>
                <h1 id="viewTitle" style="margin-bottom: 0.3rem;"></h1>
                <span id="viewDate" class="view-date"></span>
                <div id="viewContent" class="view-content"></div>
                <img id="viewImage" class="view-image glow-border" style="display: none;" onclick="openImageModal(this.src)" alt="Lampiran">
            </div>
        </div>
    </main>

    <footer>
        &copy; 2026 Aplikasi Catatan. All Rights Reserved. Powered by Arta Fortuna.
    </footer>

    <!-- MODAL GAMBAR -->
    <div id="imageModal" onclick="closeImageModal(event)">
        <span class="image-modal-close">&times;</span>
        <img class="image-modal-content glow-border" id="fullImage">
    </div>

    <!-- CUSTOM DIALOG ALERT & CONFIRM -->
    <div id="customDialog" class="custom-dialog-overlay" style="display: none;">
        <div class="custom-dialog-box glow-border">
            <p id="dialogMessage" class="dialog-message"></p>
            <div class="dialog-actions">
                <button id="btnDialogCancel" class="btn btn-secondary glow-effect">Batal</button>
                <button id="btnDialogOk" class="btn btn-primary glow-effect">OK</button>
            </div>
        </div>
    </div>

    <!-- Menghubungkan ke file JavaScript terpisah -->
    <script src="script.js"></script>
</body>
</html>
